name: Publish to PyPI
# Trusted publishing: PyPI accepts the upload on the strength of this workflow's identity
# (repository s-broda/saddlepoint-expansions, file publish.yml, environment pypi), so no token is
# stored anywhere. Set up once on pypi.org under Publishing, as a pending publisher for the
# project name saddlepoint-expansions. Runs when a GitHub release is published, or by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/saddlepoint-expansions/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
